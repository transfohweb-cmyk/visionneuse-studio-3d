<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur 3D Studio (Post-Processing)</title>
    <style>
        /* CSS INTERNE À L'IFRAME : Garantit la pleine page et la transparence */
        body {
            margin: 0;
            overflow: hidden; 
            background-color: transparent; 
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<div id="three-viewer-container" style="width: 100vw; height: 100vh;"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/examples/js/loaders/DRACOLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/examples/js/postprocessing/RenderPass.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/examples/js/postprocessing/SSAOPass.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/three@0.175.0/examples/js/postprocessing/UnrealBloomPass.js"></script> 
<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // ⭐ PARAMÈTRES - MODIFIEZ CEUX-CI UNE FOIS LES FICHIERS HÉBERGÉS
    const MODEL_URL = "1736_autosave_18196_autosave-13.glb"; 
    const HDR_URL = "brown_photostudio_02_4k.hdr"; 
    
    const container = document.getElementById('three-viewer-container');
    const width = window.innerWidth; 
    const height = window.innerHeight;

    // SCÈNE ET RENDERER
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height); 
    renderer.setClearAlpha(0); 
    
    // Rendu PBR/HDR
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.8; // Réglé plus bas pour les modèles noirs
    renderer.outputColorSpace = THREE.SRGBColorSpace; 
    renderer.shadowMap.enabled = true; 
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    container.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
    camera.position.set(0, 0, 3);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    const clock = new THREE.Clock();
    let mixer;

    // ÉCLAIRAGE HDR (VOTRE MAPPAGE HDRI PERSONNALISÉ)
    new THREE.RGBELoader().load(HDR_URL, (texture) => {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = texture; 
        scene.environmentIntensity = 1.0; 
    });

    // CHARGEMENT DU MODÈLE (ANIMATION/DRACO INCLUS)
    const loader = new THREE.GLTFLoader();
    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/libs/draco/gltf/"); 
    loader.setDRACOLoader(dracoLoader);
    
    loader.load(MODEL_URL, (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        // Centrage et Matériaux
        const box = new THREE.Box3().setFromObject(model);
        box.getCenter(new THREE.Vector3()).negate(); // Décalage vers le centre
        model.position.copy(box.getCenter(new THREE.Vector3()).negate());

        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = camera.fov * (Math.PI / 180);
        let distance = Math.abs(maxDim / 2 / Math.tan(fov / 2));
        camera.position.z = distance * 1.5;
        controls.target.copy(model.position);
        controls.update();

        model.traverse((child) => {
            if (child.isMesh) {
                child.castShadow = true; 
                child.receiveShadow = true;
            }
        });

        // Animation (Armature/Shapekeys)
        mixer = new THREE.AnimationMixer(model);
        if (gltf.animations?.length) {
            gltf.animations.forEach((clip) => {
                mixer.clipAction(clip).play();
            });
        }
    });


    // ⭐⭐⭐ POST-PROCESSING : L'INFRASTRUCTURE ⭐⭐⭐
    const composer = new THREE.EffectComposer(renderer);
    composer.setPixelRatio(window.devicePixelRatio);
    
    // 1. LA PASS DE RENDU DE BASE
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    /* // 2. AJOUT DES EFFETS SPÉCIFIQUES (DÉCOMMENTER ET CONFIGURER POUR ACTIVER)
    
    // SSAO (Ambiance Occlusion) : Ajoute de la profondeur aux plis du tissu
    const ssaoPass = new THREE.SSAOPass(scene, camera, width, height);
    ssaoPass.kernelRadius = 0.5;
    ssaoPass.minDistance = 0.005;
    ssaoPass.maxDistance = 0.1;
    composer.addPass(ssaoPass);
    
    // Unreal Bloom (Peut simuler netteté ou grain léger si bien réglé)
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(width, height), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.8;
    bloomPass.strength = 0.5; // Plus bas pour la netteté, plus haut pour la brillance
    composer.addPass(bloomPass);

    // Pour l'aberration chromatique, le grain, le DOF ou le SSR, vous devrez 
    // intégrer les modules correspondants et les ajouter ici.
    */
    // ⭐⭐⭐ FIN POST-PROCESSING ⭐⭐⭐


    // BOUCLE D'ANIMATION (UTILISE LE COMPOSER, PAS LE RENDERER)
    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);
        
        controls.update();
        // ⭐ UTILISE LE COMPOSER POUR APPLIQUER LES EFFETS ⭐
        composer.render(); 
    }
    animate();

    // GESTION DU REDIMENSIONNEMENT
    function onWindowResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        if (width > 0 && height > 0) {
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            composer.setSize(width, height); // Met à jour le composer aussi
            controls.update();
        }
    }
    window.addEventListener("resize", onWindowResize);

});
</script>
</body>
</html>
