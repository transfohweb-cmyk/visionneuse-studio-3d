<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur 3D Simple</title>
    <style>
        /* CSS INTERNE À L'IFRAME */
        body { margin: 0; overflow: hidden; background-color: transparent; }
        model-viewer { width: 100%; height: 100%; }
    </style>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <model-viewer
        src="HIC.glb" 
        alt="Modèle 3D HIC"
        
        // PARAMÈTRES VISUELS SIMPLIFIÉS
        environment-image="brown_photostudio_02_4k.hdr"
        skybox-image="brown_photostudio_02_4k.hdr"
        
        // MODES ET CONTRÔLES
        camera-controls
        auto-rotate
        shadow-intensity="1.5"
        exposure="0.8"
        
        // PERMET LA TRANSPARENCE DU FOND
        tone-mapping="neutral" 
        camera-orbit="0deg 90deg 100%"
    >
    </model-viewer>

</body>
</html>
